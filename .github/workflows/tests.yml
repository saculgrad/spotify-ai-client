name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fully offline — every test mocks the Spotify/Claude clients, so no
      # API keys or secrets need to be configured for this to run.
      - name: Run tests
        run: pytest -v
